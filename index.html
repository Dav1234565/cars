<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiverse Gallery</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d0d0d; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background-color: #121315; border-bottom: 1px solid #1f2124;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 0.8rem; letter-spacing: 2px; font-weight: 600; color: #a0a5ab; text-transform: uppercase; }
    .logo span { color: #60656c; font-weight: 400; }
    .nav-actions { display: flex; align-items: center; gap: 15px; }

    /* כפתורי אדמין */
    .admin-controls { display: none; align-items: center; gap: 10px; }
    .upload-btn, .login-btn, .logout-btn {
      background-color: #25282e; color: #d1d5db; padding: 6px 12px;
      border-radius: 4px; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; border: 1px solid #374151; transition: 0.2s;
    }
    .upload-btn:hover, .login-btn:hover, .logout-btn:hover { background-color: #374151; color: #ffffff; }

    /* Gallery */
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; }
    @media (min-width: 768px) { .gallery { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .gallery { grid-template-columns: repeat(4, 1fr); } }

    .gallery-item { position: relative; aspect-ratio: 4 / 3; overflow: hidden; cursor: pointer; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .gallery-item::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 50%);
      pointer-events: none;
    }
    .gallery-item .caption {
      position: absolute; bottom: 12px; left: 14px; z-index: 2;
      color: rgba(255, 255, 255, 0.85); font-size: 0.65rem; letter-spacing: 1.5px;
      text-transform: uppercase; font-weight: 500;
    }
    .gallery-item:hover img { transform: scale(1.05); }

    /* Modal התחברות */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: #181a1d; padding: 25px; border-radius: 8px; width: 300px;
      border: 1px solid #2d3139; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-content h3 { font-size: 1rem; color: #fff; text-align: center; }
    .modal-content input {
      padding: 10px; background: #0d0d0d; border: 1px solid #374151;
      color: #fff; border-radius: 4px; font-size: 0.85rem;
    }
    .modal-content button {
      padding: 10px; background: #374151; color: white; border: none;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Multiverse <span>by Pixelarity</span></div>
    
    <div class="nav-actions">
      <!-- אזור אדמין מוסתר כברירת מחדל -->
      <div id="admin-controls" class="admin-controls">
        <label for="file-input" class="upload-btn">+ העלה תמונה</label>
        <input type="file" id="file-input" accept="image/*" style="display:none;">
        <button id="logout-btn" class="logout-btn">התנתק</button>
      </div>

      <!-- כפתור התחברות -->
      <button id="login-modal-btn" class="login-btn">כניסת אדמין</button>
    </div>
  </header>

  <!-- גלריה -->
  <main class="gallery" id="gallery"></main>

  <!-- חלון התחברות -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <h3>התחברות אדמין</h3>
      <input type="email" id="admin-email" placeholder="אימייל">
      <input type="password" id="admin-password" placeholder="סיסמה">
      <button id="login-submit-btn">התחבר</button>
      <button id="close-modal-btn" style="background:transparent; color:#888;">ביטול</button>
    </div>
  </div>

  <script>
    // 1. הגדרות ה-Firebase שלך (יש להחליף בפרטים שתקבל מ-Firebase Console)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // אתחול Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const gallery = document.getElementById('gallery');
    const adminControls = document.getElementById('admin-controls');
    const loginModalBtn = document.getElementById('login-modal-btn');
    const loginModal = document.getElementById('login-modal');
    const fileInput = document.getElementById('file-input');

    // 2. זיהוי מצב התחברות (אדמין מחובר או לא)
    auth.onAuthStateChanged(user => {
      if (user) {
        // מחובר כאדמין
        adminControls.style.display = 'flex';
        loginModalBtn.style.display = 'none';
      } else {
        // אורח
        adminControls.style.display = 'none';
        loginModalBtn.style.display = 'block';
      }
    });

    // 3. טעינת התמונות מ-Firestore והצגתן
    db.collection('images').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
      gallery.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `
          <img src="${data.url}" alt="${data.caption}">
          <div class="caption">${data.caption}</div>
        `;
        gallery.appendChild(item);
      });
    });

    // 4. העלאת תמונה מורשית (רק כשאדמין מחובר)
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const caption = prompt("הכנס כותרת לתמונה:", "NEW IMAGE") || "UNTITLED";
      const storageRef = storage.ref(`gallery/${Date.now()}_${file.name}`);

      try {
        // העלאת הקובץ ל-Storage
        const snapshot = await storageRef.put(file);
        const downloadURL = await snapshot.ref.getDownloadURL();

        // שמירת המידע ב-Database
        await db.collection('images').add({
          url: downloadURL,
          caption: caption,
          createdAt: firebase.firestore.FieldValue.ServerTimestamp()
        });

        alert("התמונה הועלתה בהצלחה!");
      } catch (err) {
        alert("שגיאה בהעלאה: " + err.message);
      }
      fileInput.value = '';
    });

    // ניהול חלון התחברות
    loginModalBtn.onclick = () => loginModal.style.display = 'flex';
    document.getElementById('close-modal-btn').onclick = () => loginModal.style.display = 'none';

    document.getElementById('login-submit-btn').onclick = async () => {
      const email = document.getElementById('admin-email').value;
      const pass = document.getElementById('admin-password').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        loginModal.style.display = 'none';
      } catch (err) {
        alert("התחברות נכשלה: " + err.message);
      }
    };

    document.getElementById('logout-btn').onclick = () => auth.signOut();
  </script>
</body>
</html>
