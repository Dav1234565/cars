<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Cohen Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d0d0d; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background-color: #121315; border-bottom: 1px solid #1f2124;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 0.85rem; letter-spacing: 2px; font-weight: 600; color: #ffffff; text-transform: uppercase; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }

    /* כפתורים */
    .admin-btn, .upload-label {
      background-color: #25282e; color: #d1d5db; padding: 6px 12px; border-radius: 4px;
      font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      border: 1px solid #374151; transition: 0.2s; text-decoration: none;
    }
    .admin-btn:hover, .upload-label:hover { background-color: #374151; color: #ffffff; }

    #admin-controls { display: none; gap: 8px; align-items: center; }

    /* הגלריה */
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; }
    @media (min-width: 768px) { .gallery { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .gallery { grid-template-columns: repeat(4, 1fr); } }

    .gallery-item { position: relative; aspect-ratio: 4 / 3; overflow: hidden; cursor: pointer; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .gallery-item::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 50%);
      pointer-events: none;
    }
    .gallery-item .caption {
      position: absolute; bottom: 12px; left: 14px; z-index: 2;
      color: rgba(255, 255, 255, 0.85); font-size: 0.65rem; letter-spacing: 1.5px;
      text-transform: uppercase; font-weight: 500;
    }
    .gallery-item:hover img { transform: scale(1.05); }
  </style>
</head>
<body>

  <header>
    <div class="logo">DAVID COHEN GALLERY</div>
    
    <div class="nav-actions">
      <div id="admin-controls">
        <label for="image-upload" class="upload-label">+ העלה תמונה</label>
        <input type="file" id="image-upload" accept="image/*" style="display:none;" multiple>
      </div>
      <button id="admin-login-btn" class="admin-btn">כניסת אדמין</button>
    </div>
  </header>

  <main class="gallery" id="gallery"></main>

  <script>
    const CLOUD_NAME = "nwbkr2gq"; 
    const UPLOAD_PRESET = "carsssss"; 
    const ADMIN_PASSWORD = "1234"; 

    // === רשימת התמונות הציבורית (שכל העולם יראה) ===
    // תוכל להדביק כאן שורות חדשות שיתקבלו לאחר העלאה
    const PUBLIC_IMAGES = [
      // לדוגמה: { url: "https://res.cloudinary.com/...", caption: "FERRARI" },
    ];

    const loginBtn = document.getElementById('admin-login-btn');
    const adminControls = document.getElementById('admin-controls');
    const fileInput = document.getElementById('image-upload');
    const gallery = document.getElementById('gallery');

    window.addEventListener('DOMContentLoaded', loadGallery);

    loginBtn.addEventListener('click', () => {
      const pass = prompt("הכנס סיסמת אדמין:");
      if (pass === ADMIN_PASSWORD) {
        alert("התחברת בהצלחה כאדמין!");
        adminControls.style.display = "flex";
        loginBtn.style.display = "none";
      } else if (pass !== null) {
        alert("סיסמה שגויה!");
      }
    });

    // כיווץ התמונה לפני שליחה פותר את הגבלת הגודל
    function compressImage(file, maxWidth, quality, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            callback(blob);
          }, 'image/jpeg', quality);
        };
      };
    }

    // העלאת תמונה
    fileInput.addEventListener('change', async (e) => {
      const files = e.target.files;
      if (!files.length) return;

      for (let file of files) {
        const caption = prompt(`כותרת לתמונה "${file.name}":`, "NEW IMAGE") || "UNTITLED";

        // מקטין את התמונה ל-1200 פיקסלים רוחב ובאיכות 75%
        compressImage(file, 1200, 0.75, async (compressedBlob) => {
          const formData = new FormData();
          formData.append('file', compressedBlob, file.name);
          formData.append('upload_preset', UPLOAD_PRESET);

          try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
              method: 'POST',
              body: formData
            });

            const data = await res.json();

            if (res.ok && data.secure_url) {
              const item = { url: data.secure_url, caption: caption };

              // שמירה מקומית לבדיקה שלך
              const saved = JSON.parse(localStorage.getItem('cloud_gallery_images') || '[]');
              saved.unshift(item);
              localStorage.setItem('cloud_gallery_images', JSON.stringify(saved));

              renderImage(item, true);

              // הודעה המציגה את הקוד להדבקה ב-GitHub בשביל שאר העולם
              prompt(
                "התמונה הועלתה בהצלחה! כדי שגם אנשים אחרים יראו אותה, העתק את השורה הבאה והדבק אותה בתוך המערך PUBLIC_IMAGES בקוד:",
                `{ url: "${data.secure_url}", caption: "${caption}" },`
              );
            } else {
              alert("שגיאה מ-Cloudinary: " + (data.error ? data.error.message : "העלאה נכשלה"));
            }
          } catch (err) {
            alert("שגיאת תקשורת: " + err.message);
          }
        });
      }
      fileInput.value = '';
    });

    function renderImage(item, prepend = false) {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.innerHTML = `
        <img src="${item.url}" alt="${item.caption}">
        <div class="caption">${item.caption}</div>
      `;
      if (prepend) {
        gallery.insertBefore(div, gallery.firstChild);
      } else {
        gallery.appendChild(div);
      }
    }

    function loadGallery() {
      gallery.innerHTML = '';
      
      // טעינת תמונות ציבוריות מהקוד
      PUBLIC_IMAGES.forEach(item => renderImage(item));

      // טעינת תמונות שהעלית מקומית
      const saved = JSON.parse(localStorage.getItem('cloud_gallery_images') || '[]');
      saved.forEach(item => renderImage(item));
    }
  </script>

</body>
</html>
