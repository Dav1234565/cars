
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Cohen Gallery</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-color: #0071e3;
      --accent-hover: #0077ed;
      --text-main: #f5f5f7;
      --text-sub: #86868b;
      --radius-large: 24px;
      --radius-medium: 16px;
      --radius-small: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* Floating Navigation (Apple Glass Style) */
    header {
      position: sticky;
      top: 15px;
      z-index: 100;
      max-width: 90%;
      width: 1000px;
      margin: 15px auto;
      padding: 12px 24px;
      background: rgba(22, 22, 26, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .nav-actions { display: flex; align-items: center; gap: 10px; }

    /* Apple Style Buttons */
    .btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--accent-color);
      border: none;
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 15px rgba(0, 113, 227, 0.4);
    }

    .btn-danger {
      background: rgba(255, 59, 48, 0.2);
      border-color: rgba(255, 59, 48, 0.4);
      color: #ff453a;
    }

    .btn-danger:hover {
      background: rgba(255, 59, 48, 0.4);
    }

    #admin-controls { display: none; gap: 8px; align-items: center; }

    /* Gallery Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Bubble Cards */
    .gallery-item {
      position: relative;
      border-radius: var(--radius-large);
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      aspect-ratio: 4 / 3;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-item:hover {
      transform: scale(1.03) translateY(-5px);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .gallery-item:hover img { transform: scale(1.08); }

    .gallery-item .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 16px;
      opacity: 0.9;
      transition: opacity 0.3s;
    }

    .gallery-item .caption {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .gallery-item .delete-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 59, 48, 0.8);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: none;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: 0.2s;
      z-index: 5;
    }

    .gallery-item .delete-btn:hover { background: #ff3b30; transform: scale(1.1); }
    .admin-mode .gallery-item .delete-btn { display: flex; }

    /* Modals (Apple iOS Style Popup) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.active { display: flex; opacity: 1; }

    .modal-card {
      background: rgba(30, 30, 35, 0.85);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-large);
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
    }

    .modal.active .modal-card { transform: scale(1); }

    .modal-card h3 { font-size: 1.3rem; margin-bottom: 8px; font-weight: 600; }
    .modal-card p { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 20px; }

    .modal-card input[type="password"],
    .modal-card input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-small);
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.4);
      color: white;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
      text-align: center;
    }

    .modal-card input:focus { border-color: var(--accent-color); }

    .modal-buttons { display: flex; gap: 10px; justify-content: center; }
    .modal-buttons .btn { flex: 1; padding: 10px; justify-content: center; }

    /* Lightbox Modal (Zoomed Image) */
    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: var(--radius-medium);
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 25px;
      right: 25px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* WhatsApp Floating Button */
    .whatsapp-btn {
      position: fixed;
      bottom: 25px;
      left: 25px;
      background: #25d366;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
      text-decoration: none;
      z-index: 99;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .whatsapp-btn:hover { transform: scale(1.1) rotate(5deg); }

    /* QR Code Container */
    #qrcode { display: flex; justify-content: center; margin: 15px 0; padding: 15px; background: white; border-radius: var(--radius-medium); }

    /* Collage Canvas Hidden */
    #collage-canvas { display: none; }
  </style>
</head>
<body>

  <!-- Header / Navigation -->
  <header>
    <div class="logo">DAVID COHEN</div>
    
    <div class="nav-actions">
      <button class="btn" onclick="openQRModal()"><i class="fa-solid fa-qrcode"></i> QR</button>
      
      <div id="admin-controls">
        <button class="btn" onclick="triggerFileUpload()"><i class="fa-solid fa-plus"></i> העלה</button>
        <button class="btn" onclick="createCollage()"><i class="fa-solid fa-layer-group"></i> קולאז'</button>
        <input type="file" id="image-upload" accept="image/*" style="display:none;" multiple>
      </div>

      <button id="admin-login-btn" class="btn btn-primary" onclick="openLoginModal()">אדמין</button>
    </div>
  </header>

  <!-- Gallery Container -->
  <div class="container">
    <main class="gallery" id="gallery"></main>
  </div>

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/972549495729?text=%D7%94%D7%99%D7%99%20%D7%90%D7%A0%D7%99%20%D7%9E%D7%A2%D7%95%D7%A0%D7%99%D7%99%D7%9F%20%D7%91%D7%91%D7%95%D7%A7%20%D7%9E%D7%90%D7%95%D7%A8%D7%A3%20%D7%9C%D7%90%D7%95%D7%90%D7%95%20%D7%A9%D7%9C%D7%99%20" target="_blank" class="whatsapp-btn" title="דבר איתי בוואטסאפ">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <!-- Lightbox Modal (Zoomed Image) -->
  <div id="lightbox-modal" class="modal" onclick="closeModal('lightbox-modal')">
    <button class="lightbox-close">&times;</button>
    <img id="lightbox-img" class="lightbox-img" src="" alt="">
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal">
    <div class="modal-card">
      <h3>כניסת ניהול</h3>
      <p>הכנס סיסמת אדמין לניהול הגלריה</p>
      <input type="password" id="admin-pass-input" placeholder="סיסמה...">
      <div class="modal-buttons">
        <button class="btn btn-primary" onclick="submitLogin()">התחבר</button>
        <button class="btn" onclick="closeModal('login-modal')">ביטול</button>
      </div>
    </div>
  </div>

  <!-- QR Code Modal -->
  <div id="qr-modal" class="modal">
    <div class="modal-card">
      <h3>קוד QR לגלריה</h3>
      <p>סרוק כדי לפתוח את האתר בנייד</p>
      <div id="qrcode"></div>
      <div class="modal-buttons">
        <button class="btn" onclick="closeModal('qr-modal')">סגור</button>
      </div>
    </div>
  </div>

  <!-- Hidden Canvas for Collage -->
  <canvas id="collage-canvas"></canvas>

  <script>
    // 1. Cloudinary & Config
    const CLOUD_NAME = "nwbkr2gq"; 
    const UPLOAD_PRESET = "carsssss"; 
    const ADMIN_PASSWORD = "1234"; 

    // 2. Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCqjcsLYjTxTNVc-Aex3Fcs7ttbDq0KwDs",
      authDomain: "cars-e3c62.firebaseapp.com",
      databaseURL: "https://cars-e3c62-default-rtdb.firebaseio.com",
      projectId: "cars-e3c62",
      storageBucket: "cars-e3c62.firebasestorage.app",
      messagingSenderId: "677300977724",
      appId: "1:677300977724:web:7347c01cc0e6969446c339",
      measurementId: "G-8TH47ESYC2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isAdmin = false;
    let imagesData = [];

    // Realtime Listener
    db.ref('images').on('value', (snapshot) => {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      imagesData = [];
      const data = snapshot.val();
      
      if (data) {
        Object.entries(data).reverse().forEach(([key, item]) => {
          item.id = key;
          imagesData.push(item);
          renderImage(item);
        });
      }
    });

    // Render Gallery Items
    function renderImage(item) {
      const gallery = document.getElementById('gallery');
      const div = document.createElement('div');
      div.className = 'gallery-item';
      
      div.innerHTML = `
        <img src="${item.url}" alt="${item.caption}">
        <div class="overlay">
          <div class="caption">${item.caption}</div>
        </div>
        <button class="delete-btn" onclick="deleteImage(event, '${item.id}')"><i class="fa-solid fa-trash"></i></button>
      `;

      div.onclick = (e) => {
        if (!e.target.closest('.delete-btn')) {
          openLightbox(item.url);
        }
      };

      gallery.appendChild(div);
    }

    // Lightbox / Image Zoom
    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      openModal('lightbox-modal');
    }

    // Admin Auth
    function openLoginModal() { openModal('login-modal'); }
    
    function submitLogin() {
      const pass = document.getElementById('admin-pass-input').value;
      if (pass === ADMIN_PASSWORD) {
        isAdmin = true;
        document.body.classList.add('admin-mode');
        document.getElementById('admin-controls').style.display = 'flex';
        document.getElementById('admin-login-btn').style.display = 'none';
        closeModal('login-modal');
        alert("מצב מנהל הופעל בהצלחה!");
      } else {
        alert("סיסמה שגויה!");
      }
    }

    // Delete Image
    function deleteImage(event, id) {
      event.stopPropagation();
      if (confirm("האם למחוק תמונה זו מהגלריה?")) {
        db.ref('images/' + id).remove();
      }
    }

    // Upload Handler
    function triggerFileUpload() { document.getElementById('image-upload').click(); }

    document.getElementById('image-upload').addEventListener('change', async (e) => {
      const files = e.target.files;
      if (!files.length) return;

      for (let file of files) {
        const caption = prompt(`כותרת לתמונה "${file.name}":`, "CAR PHOTO") || "UNTITLED";

        compressImage(file, 1400, 0.8, async (compressedBlob) => {
          const formData = new FormData();
          formData.append('file', compressedBlob, file.name);
          formData.append('upload_preset', UPLOAD_PRESET);

          try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
              method: 'POST',
              body: formData
            });

            const data = await res.json();

            if (res.ok && data.secure_url) {
              db.ref('images').push({
                url: data.secure_url,
                caption: caption,
                timestamp: Date.now()
              });
            } else {
              alert("שגיאה בהעלאה: " + (data.error ? data.error.message : "נכשל"));
            }
          } catch (err) {
            alert("שגיאת תקשורת: " + err.message);
          }
        });
      }
    });

    // Image Compression
    function compressImage(file, maxWidth, quality, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => callback(blob), 'image/jpeg', quality);
        };
      };
    }

    // Auto Collage Creation (Merges top 4 images)
    function createCollage() {
      if (imagesData.length < 2) {
        alert("צריך לפחות 2 תמונות בגלריה כדי ליצור קולאז'!");
        return;
      }

      const canvas = document.getElementById('collage-canvas');
      const ctx = canvas.getContext('2d');
      const size = 1200;
      canvas.width = size;
      canvas.height = size;

      ctx.fillStyle = "#0d0d0d";
      ctx.fillRect(0, 0, size, size);

      const imgsToUse = imagesData.slice(0, 4);
      let loaded = 0;

      imgsToUse.forEach((item, index) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = item.url;
        img.onload = () => {
          loaded++;
          const half = size / 2;
          let x = (index % 2) * half;
          let y = Math.floor(index / 2) * half;
          
          if (imgsToUse.length === 2) {
            x = 0;
            y = index * half;
            ctx.drawImage(img, x, y, size, half);
          } else {
            ctx.drawImage(img, x, y, half, half);
          }

          if (loaded === imgsToUse.length) {
            canvas.toBlob((blob) => {
              const formData = new FormData();
              formData.append('file', blob, 'collage.jpg');
              formData.append('upload_preset', UPLOAD_PRESET);

              fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
              }).then(r => r.json()).then(data => {
                if (data.secure_url) {
                  db.ref('images').push({
                    url: data.secure_url,
                    caption: "COLLAGE EXCLUSIVE",
                    timestamp: Date.now()
                  });
                  alert("קולאז' נוצר בהצלחה ונוסף לגלריה!");
                }
              });
            }, 'image/jpeg', 0.85);
          }
        };
      });
    }

    // Modal Utilities
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // QR Code Generator
    let qrGenerated = false;
    function openQRModal() {
      if (!qrGenerated) {
        new QRCode(document.getElementById("qrcode"), {
          text: window.location.href,
          width: 180,
          height: 180
        });
        qrGenerated = true;
      }
      openModal('qr-modal');
    }
  </script>
</body>
</html>
